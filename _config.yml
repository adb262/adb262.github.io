# Site settings
title: Allan Bishop
email: adb262@cornell.edu
description: >-
  Allan Bishop — Machine Learning at Latent Health. Research in adaptive LLMs,
  world models, and clinical intelligence.
author: Allan Bishop
github_username: adb262

# URL settings
# This is a user site served at the apex domain, so baseurl is empty.
domain: adb262.github.io
url: "https://adb262.github.io"
baseurl: ""

# Build settings
# We are serving a hand-written index.html with our own CSS — no Jekyll theme
# should run. Without this, github-pages defaults to jekyll-theme-primer, which
# ships its own assets/css/style.scss that overwrites our static stylesheet.
theme: null
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Exclude from processing.
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - CLAUDE.md
  - blogs/README.md
  - assets/images/README.md
  - vendor/
  - .sass-cache/
  - .jekyll-cache/
  - node_modules/
